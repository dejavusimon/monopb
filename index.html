<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mono PB 账务台</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mono PB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one DOM, two shells. Desktop (.d) = left sidebar + wide content + right side sheet.
   Mobile (.m) = sticky top bar + single column + bottom tab bar + full-screen sheet.
   On a wide screen the mobile shell can be previewed inside a 390px phone frame (.framed). */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --sunk:#eceef2; --line:#dde0e6;
  --fg:#16181d; --muted:#626875; --accent:#16181d; --accent-soft:#e4e6eb; --on-accent:#ffffff; --logo-filter:none;
  --good:#1d7a4a; --good-soft:#e1f2e8; --warn:#9a6200; --warn-soft:#fbefd6; --bad:#b42318; --bad-soft:#fde4e1;
  --xl-head:#e8ebf0; --xl-total:#f0f2f5;
  --f-display:"Jost","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1a1d23; --sunk:#22262d; --line:#2f343d;
  --fg:#eceef2; --muted:#9aa1ad; --accent:#f2f3f5; --accent-soft:#2c3038; --on-accent:#111317; --logo-filter:invert(1);
  --good:#5fd197; --good-soft:#15301f; --warn:#f0b54a; --warn-soft:#352812; --bad:#ff8a7a; --bad-soft:#3b1814;
  --xl-head:#262a32; --xl-total:#20242b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1a1d23; --sunk:#22262d; --line:#2f343d;
  --fg:#eceef2; --muted:#9aa1ad; --accent:#f2f3f5; --accent-soft:#2c3038; --on-accent:#111317; --logo-filter:invert(1);
  --good:#5fd197; --good-soft:#15301f; --warn:#f0b54a; --warn-soft:#352812; --bad:#ff8a7a; --bad-soft:#3b1814;
  --xl-head:#262a32; --xl-total:#20242b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
/* the app is its own fixed full-screen frame: it scrolls inside, so Safari's bounce never reveals the page underneath */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
.app{height:100%}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shells ---------- */
.side,.mtop,.mbar{display:none}
.app.d{display:grid;grid-template-columns:220px minmax(0,1fr)}
.app.d .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100%;padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.app.d .scroll{min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain}
.app.d main{max-width:1180px;padding-block:24px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.app.m .scroll{min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.app.m .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));justify-content:space-between;align-items:center;gap:8px}
.app.m main{padding-block:16px calc(104px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app.m .mbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 6px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
main{display:flex;flex-direction:column;gap:18px}
/* phone-frame preview on wide screens */
.app.framed{width:390px;height:min(844px,calc(100vh - 40px));margin:20px auto;border:1px solid var(--line);border-radius:30px;overflow:hidden;position:relative;transform:translateZ(0);background:var(--bg);box-shadow:0 20px 60px rgb(0 0 0 / .18)}
.app.framed .scroll{height:100%;overflow-y:auto}
.app.framed .mtop{top:0}
.framebar{display:flex;justify-content:center;gap:8px;padding-top:16px;align-items:center}

.brand{display:flex;align-items:center;margin:0}
.logo{display:block;height:auto;filter:var(--logo-filter)}
.app.d .logo{width:150px;margin:4px 4px 6px}
.app.m .logo{width:92px}
.proto{font-size:12px;color:var(--muted)}
.sidenav{display:flex;flex-direction:column;gap:2px}
.sidenav button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--muted);text-align:left;font-weight:500}
.sidenav button:hover{background:var(--sunk);color:var(--fg)}
.sidenav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.sidenav svg,.mbar svg{width:18px;height:18px;flex:none}
.sidenav .badge{margin-left:auto}
.mbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 4px;min-height:48px;font-size:11px;color:var(--muted);position:relative}
.mbar button[aria-current="true"]{color:var(--accent);font-weight:700}
.mbar .badge{position:absolute;top:3px;left:calc(50% + 6px)}
.side .grow{flex:1}

h2{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.02em;margin:0;text-wrap:balance}
.app.m h2{font-size:18px}
h3{font-size:13px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.app.m .panel{padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.app.m .grid2{grid-template-columns:minmax(0,1fr)}

.kpis{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.app.m .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.app.m .kpi.hero{grid-column:1 / -1}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpis>.kpi{flex:1 1 170px}
.kpi .v{font-family:var(--f-mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.app.m .kpi .v{font-size:18px}
.app.m .kpi.hero .v{font-size:26px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero .v{color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700}

.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.block{width:100%;padding:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.app.m .btn{padding:8px 14px}
.app.m .btn.sm{padding:5px 11px}

.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--fg);border:0;text-align:left;width:100%}
.alert.bad{background:var(--bad-soft)}
.alert b{color:var(--warn)} .alert.bad b{color:var(--bad)}
.alert span{flex:1;min-width:0}
.alert span.hint{flex:none}

.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.ev:hover{border-color:var(--muted)}
.app.m .ev{grid-template-columns:86px minmax(0,1fr)}
.app.m .ev .right{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}
.date{display:flex;flex-direction:column;align-items:center;gap:3px;border-right:1px dashed var(--line);padding-right:10px}
.date .d{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1;white-space:nowrap}
.date .m{font-size:11px;color:var(--muted);letter-spacing:.05em;white-space:nowrap}
.ev .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .sub{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ev .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.notet{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notep{display:block;font-size:12px;line-height:1.45;color:var(--muted);background:var(--sunk);border-radius:6px;padding:4px 8px;text-align:left;overflow-wrap:anywhere}
.notep b{font-weight:500;color:var(--fg);margin-right:6px}
.month{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:4px}
.schedgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.app.m .schedgrid{grid-template-columns:minmax(0,1fr)}

.staff{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:12px;color:var(--muted)}
.app.m .pchip{padding:6px 13px;font-size:13px}
.pchip.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}

table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-bottom:0}
.tscroll{overflow-x:auto;min-width:0}

/* Excel-style tables (后台数据) */
.xl{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:70vh;background:var(--surface)}
.xl table{font-size:12px;width:max-content;min-width:100%}
.xl th,.xl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.xl thead th{position:sticky;top:0;background:var(--xl-head);color:var(--fg);z-index:1;line-height:1.3;white-space:pre-line;text-align:center;vertical-align:bottom}
.xl td.rh{background:var(--xl-head);color:var(--muted);font-family:var(--f-mono);text-align:right;position:sticky;left:0}
.xl tr.tot td{background:var(--xl-total);font-weight:700}
.xl td.n{text-align:right}
.xl .ok{color:var(--good)} .xl .wait{color:var(--warn)}
.xlcap{font-family:var(--f-display);font-size:17px;font-weight:500;margin:4px 0 0}
.sheettabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.sheettabs button{background:none;border:1px solid transparent;border-bottom:0;padding:6px 14px;border-radius:7px 7px 0 0;color:var(--muted);white-space:nowrap;font-size:13px}
.sheettabs button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);color:var(--fg);font-weight:500;margin-bottom:-1px}

/* list rows for mobile */
.lrow{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.lrow .amt{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.pcard{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.pcard .bd{font-size:12px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 12 16 / .45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:21;overflow-y:auto;overscroll-behavior:contain;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.app.m .sheet{width:100%;border-left:0;padding-left:env(safe-area-inset-left,0px)}
.app.framed .sheet{padding-top:0;padding-bottom:0}
.sheet-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:flex-start;align-items:center;gap:10px;z-index:2}
.sheet-b{padding:16px;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.steps button{flex:1;padding:7px 4px;font-size:12px;text-align:center;color:var(--muted);border:0;border-right:1px solid var(--line);background:none;cursor:pointer}
.steps button:last-child{border-right:0}
.steps button:hover{text-decoration:underline}
.stagenote{display:flex;flex-wrap:wrap;gap:6px;margin-top:-8px}
.sheet-b>.steps{position:sticky;top:var(--sheet-h,64px);z-index:1;box-shadow:0 2px 6px rgb(0 0 0 / .04)}
.sheet-b section{scroll-margin-top:calc(var(--sheet-h,64px) + 48px)}
.steps .done{color:var(--good);background:var(--good-soft)} .steps .cur{color:var(--accent);background:var(--accent-soft);font-weight:700}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.app.m .form{grid-template-columns:repeat(2,minmax(0,1fr))}
.app.m .form .wide{grid-column:1 / -1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;color:var(--fg);font-size:14px;width:100%;min-width:0}
.app.m label.f input,.app.m label.f select{padding:9px 10px;font-size:16px}
.hint{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.note.acc{background:var(--accent-soft);color:var(--fg)}
.paycode{display:flex;gap:8px;align-items:center;background:var(--sunk);border-radius:8px;padding:8px 10px;flex-wrap:wrap}
.paycode code{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:40;font-size:13px;white-space:nowrap}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px}
.tabs2 button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.mail{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.mail .msg{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:4px 8px;border-radius:6px;align-self:flex-start;overflow-wrap:anywhere}
.annprev{white-space:pre-wrap;font-family:var(--f-body);font-size:13px;background:var(--sunk);border-radius:8px;padding:10px 12px;margin:0}
.tplbox{font-family:var(--f-body);font-size:13px;line-height:1.6}
.login{max-width:380px;width:100%;margin:8vh auto 0;display:flex;flex-direction:column;gap:20px}
.app.gate .mbar,.app.gate .mtop{display:none}
.app.gate main{padding-bottom:40px}
.savestate{font-size:11px;color:var(--muted)}
.savestate[data-st="error"]{color:var(--bad)}
.whoami{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.mleft{display:flex;align-items:center;gap:4px;min-width:0}
.backbtn{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--fg);font-size:15px;font-weight:500;padding:6px 8px 6px 0;white-space:nowrap;flex:none}
.backbtn:hover{color:var(--accent)}
.backbtn[hidden]{display:none}
.tbtn{display:flex;align-items:center;min-height:42px;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;color:var(--fg);font-size:15px}
.tbtn:disabled{opacity:.6}
.svcl{display:flex;flex-wrap:wrap;gap:4px}
.chip.svc{background:var(--surface);border:1px solid var(--line)}
.chip.fee{background:var(--accent-soft)}
.chip.nofee{opacity:.55}
.wheelwrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.wscrim{position:absolute;inset:0;background:rgb(10 12 16 / .45)}
.wpanel{position:relative;width:min(460px,100%);background:var(--surface);border-radius:16px 16px 0 0;padding:6px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgb(0 0 0 / .15)}
@media (min-width:700px){.wheelwrap{align-items:center}.wpanel{border-radius:16px}}
.wtop{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.wbtn{border:0;background:none;font-size:16px;color:var(--muted);padding:8px 4px}.wbtn.pri{color:var(--fg);font-weight:600}
.wgroups{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:8px}
.wl{text-align:center;font-size:12px;color:var(--muted);margin-bottom:2px}
.wcols{display:flex;align-items:center;justify-content:center;position:relative}
.wcols::before{content:"";position:absolute;left:0;right:0;top:80px;height:40px;border-radius:10px;background:var(--accent-soft);pointer-events:none}
.wcol{position:relative;height:200px;width:56px;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;padding:80px 0;box-sizing:border-box;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);touch-action:pan-y}
.wcol::-webkit-scrollbar{display:none}
.wi{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font-size:20px;font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer}
.wi.on{color:var(--fg);font-weight:600}
.wsep{font-size:20px;font-weight:600;padding:0 2px;position:relative}
.wclear{display:block;margin:10px auto 0;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.svcbox .ckrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.ck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--fg);font-size:13px;background:var(--surface);cursor:pointer}
.ck input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chip.wide{grid-column:1 / -1;justify-self:start}
.pasttoggle{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:10px 14px;color:var(--muted);font-weight:500}
.pasttoggle:hover{border-color:var(--muted);color:var(--fg)}
.pastlist .ev{opacity:.85}
/* 禁止双指缩放 / 双击缩放 */
html,body{touch-action:pan-x pan-y}
button,a,label,input,select,textarea{touch-action:manipulation}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;padding:14px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.menu button:last-child{border-bottom:0}
.menu svg{width:20px;height:20px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<script>
/* ============ constants & helpers ============ */
/* 成员名单、家庭分组、默认负责人都在登录后由服务器下发，源代码里不写名字。 */
let PEOPLE=[];
let FAMILY={};
let FAMS=[];
let TEAM_DEF={},INBOX_EMAIL="公司邮箱";
const TYPES=["婚礼 Wedding","生日派对 Birthday","公司活动 Corporate","毕业典礼 Graduation","订婚 Engagement","其他 Other"];
const EXP_CATS=["耗材（相纸等）","设备","订阅","其他"];
const TODAY=new Date().toLocaleDateString("en-CA",{timeZone:"America/Toronto"});
/* 账期：只切换一次。2026-12-12 之前 = 2026 账期；2026-12-12 起到 2027-12-31 = 2027 账期；之后按自然年。 */
const CYCLE_SWITCH="2026-12-12";
const periodOf=d=>{d=String(d||"");if(!d)return "";if(d>=CYCLE_SWITCH&&d<"2027-01-01")return "2027";return d.slice(0,4);};
const periodRange=p=>p==="2026"?["2026-01-01","2026-12-11"]:p==="2027"?[CYCLE_SWITCH,"2027-12-31"]:[p+"-01-01",p+"-12-31"];
const VKEY="monopb-view", AKEY="monopb-auth";
const c=x=>Math.round((+x||0)*100);
const $=v=>(v<0?"-":"")+"$"+(Math.abs(v)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const $x=v=>v?$(v):"-";   // Excel-style dash for zero
const esc=s=>String(s??"").replace(/[&<>\u0022]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const uid=()=>Math.random().toString(36).slice(2,9);
function splitEven(total,names){const n=names.length,out={};if(!n)return out;const base=Math.floor(total/n);let rem=total-base*n;names.forEach(p=>{out[p]=base+(rem>0?1:0);rem--;});return out;}
const md=d=>{if(!d)return{d:"待定",m:""};const[y,mo,da]=d.split("-");return{d:`${+mo}月${+da}日`,m:`${weekday(d)} · ${y}`};};
const ICON={
 home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
 schedule:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 events:'<rect x="6" y="2" width="12" height="20" rx="1.5"/><path d="M8.5 5h7v4h-7zM8.5 10.5h7v4h-7zM8.5 16h7v3h-7z"/>',
 inbox:'<path d="M3 13h5l1.5 3h5L16 13h5M3 13l3-8h12l3 8v7H3z"/><path d="M12 4v7m-3-3 3 3 3-3"/>',
 ledger:'<path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h4"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-4 3.4-6 6.5-6s5.7 2 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.6 4.6 4.5"/>',
 data:'<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/>',
 more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
};
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ============ venues ============ */
function rebuildVenues(){S.venues={};S.events.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(e=>noteVenue(e.venue,e.travel,e.date));}
const vkey=n=>String(n||"").trim().toLowerCase().replace(/\s+/g," ");
function noteVenue(name,travel,date){name=String(name||"").trim();if(!name)return;S.venues=S.venues||{};const k=vkey(name);const v=S.venues[k]||{name,count:0};v.count++;if(travel)v.travel=travel;if(date&&(!v.last||date>v.last))v.last=date;S.venues[k]=v;}
const venueList=()=>`<datalist id="venues">${Object.values(S.venues||{}).sort((a,b)=>b.count-a.count).map(v=>`<option value="${esc(v.name)}">${v.count} 次${v.travel?` · travel ${$(v.travel)}`:""}</option>`).join("")}</datalist>`;
function defaultParams(){return{ref:.10,des:.025,svc:.025,lab:.30,shares:{},invest:{}};}

/* ============ state & sync with Google Sheet ============ */
let S={events:[],txns:[],inbox:[],params:defaultParams(),venues:{}};
let META={sheetUrl:"",lastSync:""};
let READY=false, AUTH=null, LOGIN_ERR="";
try{AUTH=JSON.parse(localStorage.getItem(AKEY))}catch(e){}
let VIEW="auto";try{VIEW=localStorage.getItem(VKEY)||"auto"}catch(e){}
let UI={tab:"home",year:periodOf(TODAY),open:null,ledgerFilter:"all",dataTab:"main",hist:[],pastOpen:false};
/* 后台接口：Apps Script 网页应用的 /exec 网址。网址本身不是秘密，没有团队口令什么都拿不到。 */
const API_URL="https://script.google.com/macros/s/AKfycbxWXg-nxXHDE3FRVmnXpjxLHMIkyHSQQHQ98IY1FmMj2xJ1c0m792KPSj7aTexRVmzANw/exec";
function api(name,...args){
  if(!/^https:/.test(API_URL))return Promise.reject(new Error("还没设置后台网址（API_URL）"));
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:name,args}),redirect:"follow"})
    .then(r=>{if(!r.ok)throw new Error("网络错误 "+r.status);return r.json();})
    .then(j=>{if(!j.ok)throw new Error(j.error||"后台出错");return j.data;});
}
let SNAP=null, QUEUE=[], SENDING=false, SAVE_STATE="";
function snapMaps(){
  const m=list=>Object.fromEntries(list.map(o=>[o.id,JSON.stringify(o)]));
  return{Events:m(S.events.map(e=>e.legacy?{...e,payouts:null}:e)),Txns:m(S.txns),Inbox:m(S.inbox),
    Venues:Object.fromEntries(Object.entries(S.venues||{}).map(([k,v])=>[k,JSON.stringify({...v,id:k})])),
    Params:{params:JSON.stringify({id:"params",...S.params})}};
}
function diffOps(){
  const cur=snapMaps(),ops=[];
  for(const t of Object.keys(cur)){
    for(const id of Object.keys(cur[t]))if(SNAP[t][id]!==cur[t][id])ops.push({op:"upsert",table:t,obj:JSON.parse(cur[t][id])});
    if(t!=="Params")for(const id of Object.keys(SNAP[t]))if(!(id in cur[t]))ops.push({op:"delete",table:t,id});
  }
  SNAP=cur;return ops;
}
function setSave(st){SAVE_STATE=st;const txt={saving:"保存中…",saved:"已保存",error:"保存失败",offline:""}[st]||"";
  document.querySelectorAll(".savestate").forEach(el=>{el.textContent=txt;el.dataset.st=st;});}
function save(){
  if(!READY)return;
  const ops=diffOps();if(!ops.length)return;
  QUEUE.push(ops);pump();
}
function pump(){
  if(SENDING||!QUEUE.length)return;
  SENDING=true;setSave("saving");
  const ops=QUEUE.shift();
  api("apiMutate",AUTH.code,AUTH.who,JSON.stringify(ops)).then(()=>{SENDING=false;setSave(QUEUE.length?"saving":"saved");pump();})
   .catch(err=>{SENDING=false;QUEUE=[];setSave("error");toast("保存失败："+(err&&err.message||err)+"，已重新载入");load(true);});
}
function applyLoad(d){
  S.events=d.events.map(e=>({...e,staff:e.staff||[]}));
  S.txns=d.txns;S.inbox=d.inbox;S.params={...defaultParams(),...d.params};S.venues=d.venues||{};
  META.sheetUrl=d.sheetUrl;META.lastSync=d.lastSync;
  if(d.team){PEOPLE=d.team.people||[];FAMILY=d.team.family||{};FAMS=[...new Set(PEOPLE.map(p=>FAMILY[p]).filter(Boolean))];TEAM_DEF=d.team.defaults||{};INBOX_EMAIL=d.team.inboxEmail||INBOX_EMAIL;
    if(AUTH&&!PEOPLE.includes(AUTH.who)){AUTH.who="";}}
  // 2026 场次：已在 10/25 一次结清，按算法还原每人明细（只用于显示，不写回）
  for(const e of S.events)if(e.legacy&&!e.payouts)e.payouts=calc(e).lines.map(p=>({...p,paid:true,legacy:true}));
  SNAP=snapMaps();
  if(!Object.keys(S.venues).length&&S.events.length){rebuildVenues();save();}
}
function load(quiet){
  if(!AUTH)return Promise.resolve();
  return api("apiLoad",AUTH.code).then(json=>{applyLoad(JSON.parse(json));READY=true;LOGIN_ERR="";render();})
   .catch(err=>{const msg=String(err&&err.message||err);
     if(/口令/.test(msg)){AUTH=null;try{localStorage.removeItem(AKEY)}catch(e){}LOGIN_ERR=/太多/.test(msg)?msg:"团队口令不对，请重新输入";READY=false;}
     else if(!quiet)LOGIN_ERR="载入失败："+msg;
     render();});
}
const pendingInbox=()=>S.inbox.filter(m=>!m.status||m.status==="pending");

/* ============ core algorithm ============ */
const SVCS=["Photobooth","Audiobook"];
/* 时间：存成 "HH:MM–HH:MM"。老数据没写上下午的（例 3:30-5:30），1–7 点按下午算。 */
function parseT(x){x=String(x||"").trim().toLowerCase();const m=x.match(/(\d{1,2})(?:[:：.](\d{2}))?\s*(am|pm|上午|下午|晚上)?/);if(!m)return null;let h=+m[1],mi=+(m[2]||0);const ap=m[3];
  if(ap==="pm"||ap==="下午"||ap==="晚上"){if(h<12)h+=12;}else if(ap==="am"||ap==="上午"){if(h===12)h=0;}else if(h>=1&&h<=7)h+=12;
  if(h>23||mi>59)return null;return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");}
function parseTR(x){const p=String(x||"").split(/\s*(?:–|—|-|~|～|至|到|to)\s*/i).filter(Boolean);const a=parseT(p[0]),b=parseT(p[1]);return a?[a,b||a]:null;}

const svcs=e=>{const a=(Array.isArray(e.services)?e.services:String(e.services||"").split(/[,，]\s*/)).filter(x=>x&&SVCS.includes(x));return a.length?a:["Photobooth"];};

function calc(ev,P=S.params,st=S){
  const price=ev.price||0,travel=ev.travel||0,ot=ev.otFee||0,staff=ev.staff||[];
  const parking=ev.parking||0,audio=hasSvc(ev,"Audiobook")?(ev.audioPrice||0):0;
  const referral=Math.round(price*P.ref),design=Math.round(price*P.des),service=Math.round(price*P.svc),labour=Math.round(price*P.lab);
  const net=price-referral-design-service-labour;
  const lab=splitEven(labour,staff),ots=splitEven(ot,staff);
  const tr=ev.travelSplit?{...ev.travelSplit}:splitEven(travel,staff);
  const trSum=Object.values(tr).reduce((a,b)=>a+b,0);
  const pk=ev.parkingSplit?{...ev.parkingSplit}:splitEven(parking,staff);
  const pkSum=Object.values(pk).reduce((a,b)=>a+b,0);
  const lines={};
  const add=(p,k,v)=>{if(!p||!v)return;lines[p]=lines[p]||{person:p,labour:0,travel:0,parking:0,overtime:0,referral:0,design:0,service:0};lines[p][k]+=v;};
  staff.forEach(p=>{add(p,"labour",lab[p]);add(p,"travel",tr[p]||0);add(p,"parking",pk[p]||0);add(p,"overtime",ots[p]);});
  add(ev.referrer,"referral",referral);add(ev.designer,"design",design);add(ev.service,"service",service);
  const out=Object.values(lines).map(l=>({...l,total:l.labour+l.travel+l.parking+l.overtime+l.referral+l.design+l.service}));
  const sh=Object.entries(P.shares),dv={};let used=0;
  sh.forEach(([p,s])=>{dv[p]=Math.floor(net*s);used+=dv[p];});
  let r=net-used;for(const[p] of sh){if(r<=0)break;dv[p]++;r--;}
  const due=price+travel+parking+ot;
  const pays=((st&&st.txns)||[]).filter(t=>t.kind==="client"&&t.eventId===ev.id);
  const received=pays.reduce((a,t)=>a+t.amount,0);
  const memberTotal=out.reduce((a,l)=>a+l.total,0);
  return{price,travel,parking,audio,ot,referral,design,service,labour,pool:labour+travel+parking+ot,net,lines:out,dividends:dv,due,received,pays,outstanding:due-received,trSum,pkSum,memberTotal,check:due-memberTotal-net};
}

function effect(t){
  if(t.legacy)return 0;
  if(t.kind==="opening")return t.amount;
  if(t.kind==="client")return t.held?0:t.amount;
  if(t.kind==="expense")return t.paidBy?0:-t.amount;

function txnInfo(t){
  const kinds={opening:["期初",""],client:["客户付款","good"],expense:["支出","bad"],payout:["付给成员","acc"],capital:[t.amount<0?"撤资":"注资",""]};
  const[kt,kc]=kinds[t.kind]||["",""];
  const sign=(t.kind==="client"||t.kind==="opening"||(t.kind==="capital"&&t.amount>0))?"+":"−";
  let desc=t.label||"";
  if(t.kind==="client")desc=`${t.eventId} ${t.label||""} · ${t.method}${t.ref?` · <span class="mono">${t.ref}</span>`:""}`;
  if(t.kind==="expense")desc=`${t.cat}${t.label?" · "+esc(t.label):""}${t.party&&t.party!=="公司"?`（${esc(t.party)}）`:""}`;
  if(t.kind==="capital")desc=`${esc(t.party||"")} ${esc(t.label||"")}`;
  if(t.kind==="payout")desc=`${t.party} · ${t.sub}${t.eventId?` · ${t.eventId}`:""}`;
  let flag="";
  if(t.kind==="client"&&t.held)flag=`<span class="chip warn">${t.held} 现金代收</span> <button class="btn sm" data-act="deposit" data-id="${t.id}">已存入公司</button>`;
  if(t.kind==="expense"&&t.paidBy)flag=t.reimbursed?`<span class="chip good">${t.paidBy} 垫付·已报销</span>`:`<span class="chip warn">${t.paidBy} 垫付</span> <button class="btn sm" data-act="reimburse" data-id="${t.id}">已报销</button>`;
  return{kt,kc,sign,desc,flag};
}

function memberTotals(year){
  const T={};PEOPLE.forEach(p=>T[p]={events:0,work:0,workPaid:0,ref:0,des:0,svc:0,feesPaid:0,owed:0,adv:0,advPaid:0,held:0});
  for(const e of S.events){if(year&&yearOf(e)!==year)continue;
    (e.payouts||[]).forEach(l=>{const x=T[l.person];const w=l.labour+l.travel+(l.parking||0)+l.overtime,fe=l.referral+l.design+l.service;
      if(w)x.events++;x.work+=w;x.ref+=l.referral;x.des+=l.design;x.svc+=l.service;
      if(l.paid){x.workPaid+=w;x.feesPaid+=fe;}else x.owed+=l.total;});}
  S.txns.filter(t=>t.kind==="expense"&&t.paidBy&&(!year||periodOf(t.date)===year)).forEach(t=>{T[t.paidBy].adv+=t.amount;if(t.reimbursed)T[t.paidBy].advPaid+=t.amount;});
  heldCash().forEach(t=>T[t.held].held+=t.amount);
  return T;
}

function stageNote(e,k,st){
  const chips=[];
  if(e.legacy)return`<span class="chip good">2026 迁入 · 已结清</span>`;
  if(e.date&&e.date>TODAY){const days=Math.round((new Date(e.date+"T12:00:00")-new Date(TODAY+"T12:00:00"))/864e5);chips.push(`<span class="chip">活动还有 ${days} 天</span>`);}
  else if(st.k==="done")chips.push(`<span class="chip warn">活动已办完，可以结算</span>`);
  else if(st.k==="settling")chips.push(`<span class="chip acc">已结算，还有成员没打款</span>`);
  if(e.price==null)chips.push(`<span class="chip warn">总价未填</span>`);
  else if(k.received<=0)chips.push(`<span class="chip bad">定金未收到</span>`);
  else if(k.outstanding>0)chips.push(`<span class="chip bad">尾款未收到 · 待收 ${$(k.outstanding)}</span>`);
  else chips.push(`<span class="chip good">款已收齐</span>`);
  return chips.join("");
}
function legacyCompare(e,k){
  const diff=k.net-e.oldNet;
  return `<div class="note"><b>与旧表对照</b><br>旧表公司营收 <span class="mono">${$(e.oldNet)}</span>，新算法 <span class="mono">${$(k.net)}</span>${diff?`，相差 <span class="mono">${$(diff)}</span>。${diff===k.travel?"差额正好等于 travel：客户另付了 travel，旧表又从套餐价里扣了一次。":"差额来自四舍五入。"}`:"，一致。"}</div>`;
}

let toastT;function toast(m){clearTimeout(toastT);let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.getElementById("app").appendChild(t);}t.textContent=m;toastT=setTimeout(()=>t.remove(),1800);}
function commit(msg){save();render();if(msg)toast(msg);}
function copy(txt){
  const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?"已复制":"复制失败，请长按手动复制");};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(()=>toast("已复制"),fb);else fb();}

    reimburse(){const t=S.txns.find(x=>x.id===d.id);t.reimbursed=true;S.txns.push({id:uid(),kind:"payout",sub:"报销",date:TODAY,party:t.paidBy,amount:t.amount,expenseId:t.id,label:""});commit(`已报销给 ${t.paidBy}`);},
    deltxn(){if(b.dataset.armed){S.txns=S.txns.filter(x=>x.id!==d.id);commit("已删除");}else{b.dataset.armed="1";b.textContent="确认删除?";}},
    paydiv(){const s=summary(UI.year);for(const p of Object.keys(S.params.shares)){const x=(s.div[p]||0)-(s.divPaid[p]||0);if(x>0)S.txns.push({id:uid(),kind:"payout",sub:"分红",year:UI.year,date:TODAY,party:p,amount:x});}commit("分红已发放");},
    reload(){load().then(()=>toast("已刷新"));},
    syncnow(){b.disabled=true;b.textContent="检查中…";api("apiSyncNow",AUTH.code).then(j=>{const r=JSON.parse(j);toast(r.added?`读到 ${r.added} 笔新到账，自动入账 ${r.auto} 笔`:"没有新的到账通知");return load(true);}).catch(e=>{toast("检查失败："+(e.message||e));b.disabled=false;});},
    back(){if(UI.open){UI.open=null;renderSheet();return;}let t=UI.hist.pop();while(t&&MORE.includes(t))t=UI.hist.pop();UI.tab=t||"home";render();UI.open="more";renderSheet();},
    tpick(){const isNew=d.tfor==="new";const e=isNew?null:S.events.find(x=>x.id===UI.open);
      const cur=isNew?document.getElementById("n-time").value:(e&&e.time)||"";
      openWheel(cur,val=>{if(isNew){document.getElementById("n-time").value=val;document.getElementById("n-time-b").innerHTML=tLabel(val);}else if(e){e.time=val;commit();}});},
    togglepast(){UI.pastOpen=!UI.pastOpen;render();},
    pickwho(){AUTH.who=d.who;try{localStorage.setItem(AKEY,JSON.stringify(AUTH))}catch(e){}render();},
    login(){const code=v("lg-code").trim();if(!code){toast("请输入团队口令");return;}
      AUTH={who:(AUTH&&AUTH.who)||"",code};try{localStorage.setItem(AKEY,JSON.stringify(AUTH))}catch(e){}LOGIN_ERR="";render();load();},
    logout(){AUTH=null;READY=false;PEOPLE=[];S={events:[],txns:[],inbox:[],params:defaultParams(),venues:{}};try{localStorage.removeItem(AKEY)}catch(e){}render();},
  };
  A[act]&&A[act]();
});
function payLine(e,l){l.paid=true;l.paidOn=TODAY;S.txns.push({id:uid(),kind:"payout",sub:"活动结算",date:TODAY,party:l.person,eventId:e.id,amount:l.total});}
document.addEventListener("change",ev=>{
  const t=ev.target,d=t.dataset;
  if(d.fb){const e=S.events.find(x=>x.id===UI.open);e[d.fb]=t.checked;commit(t.checked?"已标记":"");return;}
  if(d.f){const e=S.events.find(x=>x.id===UI.open);if(!e)return;
    let val=t.value;if("money" in d)val=val===""?(d.f==="price"?null:0):c(val);else if(d.f==="otHours")val=+val||0;
    e[d.f]=val;if(d.f==="travel")e.travelSplit=null;if(d.f==="parking")e.parkingSplit=null;if(d.f==="venue")noteVenue(val,e.travel,e.date);commit();return;}
  if(t.id==="n-venue"){const k=S.venues&&S.venues[vkey(t.value)];const tr=document.getElementById("n-travel");const h=document.getElementById("n-vhint");
    if(k){if(k.travel&&!tr.value)tr.value=k.travel/100;h.textContent=`去过 ${k.count} 次${k.last?`，上次 ${k.last}`:""}${k.travel?`，travel 已按上次填 ${$(k.travel)}`:""}`;}else h.textContent=t.value?"新场地，创建后会记住":"";return;}
  if(d.svc){const e=S.events.find(x=>x.id===UI.open);if(!e)return;let sv=svcs(e).slice();
    if(t.checked){if(!sv.includes(d.svc))sv.push(d.svc);}else{sv=sv.filter(x=>x!==d.svc);if(d.svc==="Audiobook")e.audioPrice=0;}
    e.services=SVCS.filter(x=>sv.includes(x));commit();return;}
  if(d.nsvc){if(d.nsvc==="Audiobook")document.getElementById("n-audio-w").hidden=!t.checked;return;}
  if(d.ps){const e=S.events.find(x=>x.id===UI.open);const base=e.parkingSplit||splitEven(e.parking||0,e.staff);base[d.ps]=c(t.value);e.parkingSplit={...base};commit();return;}
  if(d.ts){const e=S.events.find(x=>x.id===UI.open);const base=e.travelSplit||splitEven(e.travel,e.staff);base[d.ts]=c(t.value);e.travelSplit={...base};commit();return;}
  if(d.tpl){S.params.tpl={...(S.params.tpl||{}),[d.tpl]:t.value};save();toast("模板已保存");return;}
  if(d.param){S.params[d.param]=(+t.value||0)/100;commit("参数已更新");return;}
  if(d.share){S.params.shares[d.share]=(+t.value||0)/100;commit("分红比例已更新");return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&UI.open){UI.open=null;renderSheet();}});
let lastM=isM(),lastW=wide();
window.addEventListener("resize",()=>{if(isM()!==lastM||wide()!==lastW){lastM=isM();lastW=wide();render();}});
document.getElementById("logo2").src=document.querySelector(".side .logo").src;
/* 禁止缩放：iOS 的手势、双指 touchmove、电脑触控板的 ctrl+滚轮 */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
window.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","=","-","_","0"].includes(e.key))e.preventDefault();});
render();load();
setInterval(()=>{const a=document.activeElement;if(READY&&document.visibilityState==="visible"&&!UI.open&&!SENDING&&!QUEUE.length&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))load(true);},90000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&READY&&!UI.open&&!SENDING&&!QUEUE.length)load(true);});
</script>
